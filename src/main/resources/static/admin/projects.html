<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10233f">
    <title>项目列表 · GEO 管理平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-login1">
    <link rel="stylesheet" href="./styles/components.css?v=20261017-layout4">
    <link rel="stylesheet" href="./styles/forms.css?v=20261017-layout4">
    <script src="./shared/navigation.js?v=20261026-import-export1" defer></script>
</head>
<body class="standard-page">
<div class="app-shell">
    <aside class="sidebar" aria-label="主导航" data-admin-navigation></aside>
    <div class="main-area">
        <header class="topbar"><div class="breadcrumb" aria-label="当前位置"></div><div class="topbar-label">管理平台</div></header>
        <main class="content">
            <div class="page-heading"><div><p class="eyebrow">PROJECT MANAGEMENT</p><h1>项目列表</h1><p class="page-description">集中查看项目基础资料，使用项目 ID 关联后续监测与分析任务。</p></div><a class="primary-button" href="./project-create.html?v=20261011-config3">＋ 创建项目</a></div>
            <section class="list-panel" aria-label="项目列表">
                <div class="panel-heading"><div><h2>基础档案</h2><p id="project-total">正在加载…</p></div><form id="project-search" class="form-search"><label for="keyword" class="visually-hidden">项目名称</label><input id="keyword" maxlength="200" placeholder="按项目名称查询"><button class="refresh-button" type="submit">查询</button></form></div>
                <p id="project-error" class="notice notice-error" role="alert" hidden></p>
                <p id="project-success" class="notice notice-loading" role="status" hidden></p>
                <div class="table-scroll"><table><thead><tr><th>项目 ID</th><th>项目／产品名称</th><th>行业／品类</th><th>官网／资料</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="project-rows"></tbody></table></div>
                <div class="pagination"><span id="project-page">第 1 页</span><div><button id="previous-page" class="text-button" type="button">上一页</button><button id="next-page" class="text-button" type="button">下一页</button></div></div>
            </section>
            <section id="project-detail" class="list-panel form-section" aria-label="项目资料" hidden><div class="panel-heading"><div><h2 id="detail-name">项目资料</h2><p>已保存的完整基础信息</p></div><button id="close-detail" class="text-button" type="button">收起</button></div><dl id="detail-fields" class="form-grid"></dl></section>
        </main>
    </div>
</div>
<script src="./shared/http.js?v=20261029-failure1"></script>
<script src="./projects.js?v=20261027-delete1"></script>
</body>
</html>
