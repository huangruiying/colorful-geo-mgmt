<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据导入导出 · GEO 管理平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-login1">
    <link rel="stylesheet" href="./styles/components.css?v=20261017-layout4">
    <link rel="stylesheet" href="./styles/forms.css?v=20261017-layout4">
    <link rel="stylesheet" href="./data-transfer.css?v=20261024-transfer2">
    <script src="./shared/navigation.js?v=20261024-transfer1" defer></script>
</head>
<body class="standard-page transfer-page">
<div class="app-shell">
    <aside class="sidebar" aria-label="主导航" data-admin-navigation></aside>
    <div class="main-area">
        <header class="topbar"><div class="breadcrumb" aria-label="当前位置"></div><div class="topbar-label">管理平台</div></header>
        <main class="content">
            <div class="page-heading"><div><p class="eyebrow">BASIC CONFIGURATION</p><h1>数据导入导出</h1><p class="page-description">在不同环境之间迁移项目及完整诊断数据。一个项目保存为一个 JSON 文件，最大 50 MiB。</p></div></div>
            <p id="transfer-error" class="notice notice-error" role="alert" hidden></p>
            <p id="transfer-status" class="notice notice-loading" role="status" hidden></p>
            <section class="list-panel">
                <div class="panel-heading"><div><h2>导出项目数据</h2><p>包含项目、诊断方案、任务、回答和报告；不包含内容优化、发布记录及渠道连接配置。存在未结束的任务或报告时不能导出。</p></div></div>
                <form id="project-search" class="form-search"><label for="keyword">项目名称</label><input id="keyword" maxlength="200" placeholder="按项目名称查询"><button class="refresh-button" type="submit">查询</button></form>
                <div class="table-scroll"><table><thead><tr><th>项目 ID</th><th>项目名称</th><th>操作</th></tr></thead><tbody id="project-rows"></tbody></table></div>
                <div class="pagination"><span id="project-page"></span><div><button class="text-button" id="previous-page" type="button">上一页</button><button class="text-button" id="next-page" type="button">下一页</button></div></div>
            </section>
            <section class="list-panel">
                <div class="panel-heading"><div><h2>导入项目数据</h2><p>导入后保留原名称并生成新的项目 ID，不覆盖已有项目。目标环境必须先配置文件引用的全部渠道编码。API Key 不随文件迁移。</p><p>历史记录不会自动执行。要继续诊断，请从导入的方案创建新任务。每次成功导入都会新建一个项目副本。</p></div></div>
                <form id="project-import"><label for="project-file">选择项目 JSON 文件</label><input id="project-file" type="file" accept=".json,application/json" required><button class="primary-button" id="import-button" type="submit">导入为新项目</button></form>
                <div id="import-result" role="status" hidden></div>
            </section>
        </main>
    </div>
</div>
<script src="./shared/http.js?v=20261021-login1"></script>
<script src="./data-transfer.js?v=20261024-transfer1"></script>
</body>
</html>
