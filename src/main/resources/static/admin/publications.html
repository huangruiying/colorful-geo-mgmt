<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10233f">
    <title>发布记录 · GEO 管理平台</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./contents.css">
    <link rel="stylesheet" href="./publications.css">
    <script src="./publications.js" defer></script>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="./contents.html" aria-label="GEO 管理平台首页">
            <span class="brand-mark" aria-hidden="true">G</span>
            <span class="brand-copy"><strong>GEO 管理平台</strong><small>CONTENT OPERATIONS</small></span>
        </a>
        <nav class="navigation" aria-label="功能菜单">
            <span class="navigation-group">内容投放</span>
            <a class="navigation-item" href="./contents.html"><span class="navigation-icon" aria-hidden="true">▤</span><span>内容优化记录</span></a>
            <a class="navigation-item active" href="./publications.html" aria-current="page"><span class="navigation-icon" aria-hidden="true">▧</span><span>发布记录</span></a>
            <a class="navigation-item" href="./browser-login.html"><span class="navigation-icon" aria-hidden="true">◈</span><span>浏览器登录管理</span></a>
        </nav>
        <div class="sidebar-footer">GEO 内容运营工作台</div>
    </aside>
    <div class="main-area">
        <header class="topbar"><div class="breadcrumb">内容投放 <span>/</span> <strong>发布记录</strong></div><div class="topbar-label">管理平台</div></header>
        <main class="content">
            <div class="page-heading">
                <div><p class="eyebrow">PUBLICATION HISTORY</p><h1>发布记录</h1><p class="page-description">查看每篇优化内容在各平台的预发布及实际发布状态。删除只清理本地记录，不会删除平台草稿或文章。</p></div>
                <button id="refresh-records" class="refresh-button" type="button">刷新列表</button>
            </div>
            <section class="list-panel" aria-labelledby="publish-list-title">
                <div class="panel-heading"><div><h2 id="publish-list-title">发布列表</h2><p>每条记录对应一篇优化内容的一个平台。</p></div><span id="record-total" class="updated-at">正在加载…</span></div>
                <div id="page-notice" class="notice" role="status" aria-live="polite" hidden></div>
                <div class="table-scroll">
                    <table class="publication-table">
                        <thead><tr><th scope="col">记录 / 来源</th><th scope="col">平台 / 标题</th><th scope="col">状态</th><th scope="col">平台结果</th><th scope="col">时间</th><th scope="col">操作</th></tr></thead>
                        <tbody id="record-rows"><tr><td class="table-message" colspan="6">正在读取发布记录…</td></tr></tbody>
                    </table>
                </div>
                <div class="pagination"><span id="page-label">第 1 页</span><div><button id="previous-page" class="text-button" type="button">上一页</button><button id="next-page" class="text-button" type="button">下一页</button></div></div>
            </section>
        </main>
    </div>
</div>
<dialog id="record-dialog" class="modal modal-wide">
    <div class="modal-body">
        <div class="modal-heading"><div><h2 id="detail-title">发布记录详情</h2><p>本地确认稿快照与平台返回信息</p></div><button id="close-detail" class="close-button" type="button" aria-label="关闭">×</button></div>
        <div id="detail-meta" class="detail-meta"></div>
        <section><h3>最终发布正文</h3><div id="detail-content" class="article-preview"></div></section>
        <div class="modal-actions"><button id="close-detail-bottom" class="text-button" type="button">关闭</button></div>
    </div>
</dialog>
</body>
</html>
