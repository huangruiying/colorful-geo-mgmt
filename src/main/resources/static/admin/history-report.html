<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10233f">
    <title>诊断报告 · GEO 管理平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-login1">
    <link rel="stylesheet" href="./styles/components.css?v=20261017-layout4">
    <link rel="stylesheet" href="./styles/diagnosis.css?v=20261017-layout4">
    <link rel="stylesheet" href="./diagnosis-reports.css?v=20261019-report-html1">
    <link rel="stylesheet" href="./markdown-view.css?v=20261017-md2">
    <script src="./shared/navigation.js?v=20261026-import-export1" defer></script>
</head>
<body class="diagnosis-page">
<div class="app-shell">
    <aside class="sidebar" aria-label="主导航" data-admin-navigation></aside>
    <div class="main-area">
        <header class="topbar"><div class="breadcrumb" aria-label="当前位置"></div><div class="topbar-label">管理平台</div></header>
        <main class="content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">DIAGNOSIS REPORTS</p>
                    <h1>诊断报告</h1>
                    <p class="page-description">选择一次已结束的诊断任务生成报告，逐条判定回答并汇总各模型的提及、推荐与用户关注点。</p>
                </div>
                <button type="button" class="primary-button" id="new-report">生成诊断报告</button>
            </div>
            <div id="report-error" class="notice error" role="alert" hidden></div>
            <div id="report-success" class="notice success" role="status" hidden></div>
            <section class="list-panel" aria-label="诊断报告列表">
                <div class="panel-heading"><h2>诊断报告</h2><form id="report-filters" class="inline-controls">
                    <select id="filter-status" aria-label="筛选状态"><option value="">全部状态</option><option value="PENDING">待生成</option><option value="RUNNING">生成中</option><option value="SUCCEEDED">已完成</option><option value="FAILED">失败</option></select>
                    <button class="refresh-button">查询</button>
                </form></div>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th scope="col">报告</th><th scope="col">方案 / 项目</th><th scope="col">状态</th><th scope="col">判定进度</th><th scope="col">创建时间</th><th scope="col">操作</th></tr></thead>
                        <tbody id="report-list"></tbody>
                    </table>
                </div>
                <div class="task-pagination"><button type="button" class="refresh-button" id="report-previous">上一页</button><span id="report-page-info"></span><button type="button" class="refresh-button" id="report-next">下一页</button></div>
            </section>
            <p class="help">报告由后台逐条判定，关闭页面不影响生成。判定使用已启用渠道中分数最高的模型，每条回答调用一次，会产生模型费用；判定失败不重试。</p>
        </main>
    </div>
</div>
<dialog id="create-report-dialog" class="task-dialog task-create-dialog" aria-labelledby="create-report-title">
    <div class="panel-heading"><h2 id="create-report-title">生成诊断报告</h2><button type="button" class="refresh-button" id="close-create">关闭</button></div>
    <form id="create-report-form" class="task-dialog-body">
        <div id="create-error" class="notice error" role="alert" hidden></div>
        <label class="task-field">诊断任务<select id="create-task" required><option value="">正在加载…</option></select></label>
        <p class="help">只列出已结束且有成功回答的任务。报告分析该任务全部成功且未被截断的回答。</p>
        <div class="task-actions"><button type="button" class="refresh-button" id="cancel-create">取消</button><button type="submit" class="primary-button" id="submit-create">生成</button></div>
    </form>
</dialog>
<dialog id="report-detail-dialog" class="task-dialog report-detail-dialog" aria-labelledby="report-detail-title">
    <div class="panel-heading"><div class="task-detail-heading"><h2 id="report-detail-title">诊断报告</h2><p id="report-detail-note" class="help"></p></div><div class="task-header-actions"><select id="report-model-filter" class="report-model-filter" aria-label="按模型筛选" hidden></select><button type="button" class="primary-button report-supplement-button" id="supplement-report" hidden>补全报告</button><button type="button" class="refresh-button report-export-button" id="export-report-html" title="六个页签展开为一个网页文件下载，可离线打开或转发" hidden>导出网页</button><button type="button" class="refresh-button" id="close-detail">关闭</button></div></div>
    <div class="task-dialog-body">
        <div id="detail-error" class="notice error" role="alert" hidden></div>
        <div class="report-tabs" role="tablist" id="report-tabs"></div>
        <div id="report-panel"></div>
    </div>
</dialog>
<dialog id="evidence-dialog" class="task-dialog task-answer-dialog" aria-labelledby="evidence-title">
    <div class="panel-heading"><div><h2 id="evidence-title">证据</h2><p class="help">由规则从本报告数据中计算，点「看回答」可查看完整回答。</p></div><button type="button" class="refresh-button" id="close-evidence">返回报告</button></div>
    <div class="task-dialog-body"><div id="evidence-content"></div></div>
</dialog>
<dialog id="answer-dialog" class="task-dialog task-answer-dialog" aria-labelledby="answer-title">
    <div class="panel-heading"><div><h2 id="answer-title">回答原文</h2><p id="answer-note" class="help"></p></div><button type="button" class="refresh-button" id="close-answer">返回报告</button></div>
    <div class="task-dialog-body"><div id="answer-error" class="notice error" role="alert" hidden></div><div id="answer-content" class="answer-body"></div></div>
</dialog>
<script src="./vendor/markdown-it-15.0.3.min.js" defer></script>
<script src="./vendor/katex-0.19.0.min.js" defer></script>
<script src="./vendor/markdown-it-texmath-1.0.0.js" defer></script>
<script src="./markdown-view.js?v=20261017-md2" defer></script>
<script src="./shared/http.js?v=20261021-login1" defer></script>
<script src="./shared/async.js?v=20261017-lifecycle1" defer></script>
<script src="./shared/pagination.js?v=20261017-lifecycle1" defer></script>
<script src="./shared/dialog.js?v=20261017-lifecycle1" defer></script>
<script src="./shared/format.js?v=20261017-shared3" defer></script>
<script src="./shared/html-export.js?v=20261019-report-html1" defer></script>
<script src="./diagnosis-reports.js?v=20261020-visibility1" defer></script>
</body>
</html>
