<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10233f">
    <title>项目创建 · GEO 管理平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-login1">
    <link rel="stylesheet" href="./styles/components.css?v=20261017-layout4">
    <link rel="stylesheet" href="./styles/forms.css?v=20261017-layout4">
    <script src="./shared/navigation.js?v=20261026-import-export1" defer></script>
</head>
<body class="standard-page">
<div class="app-shell">
    <aside class="sidebar" aria-label="主导航" data-admin-navigation></aside>
    <div class="main-area">
        <header class="topbar"><div class="breadcrumb" aria-label="当前位置"></div><div class="topbar-label">管理平台</div></header>
        <main class="content">
            <div class="page-heading"><div><p class="eyebrow">PROJECT MANAGEMENT</p><h1>项目创建</h1><p class="page-description">保存项目或产品的基础资料，后续监测与分析任务可直接关联项目。</p></div></div>
            <form id="project-form">
<section class="list-panel form-section"><div class="panel-heading"><div><h2>基础信息</h2><p>以下五项为必填，作为后续监测与分析的基础资料。</p></div></div><div class="form-grid">
<label class="form-field"><span>项目／产品名称 <em>必填</em></span><input id="name" name="name" placeholder="例如：迈极炫 MAGICSHINE" required maxlength="200" type="text"></label>
<label class="form-field"><span>官网或资料 URL <em>必填</em></span><input id="websiteUrl" name="websiteUrl" placeholder="https://example.com" required maxlength="2048" type="url"></label>
<label class="form-field"><span>行业／品类 <em>必填</em></span><input id="industry" name="industry" placeholder="例如：户外运动照明" required maxlength="200" type="text"></label>
<label class="form-field form-field-wide"><span>核心功能 <em>必填</em></span><textarea id="coreFeatures" name="coreFeatures" placeholder="说明产品能解决哪些问题" required maxlength="5000" rows="3"></textarea></label>
<label class="form-field form-field-wide"><span>目标用户群体 <em>必填</em></span><textarea id="targetAudience" name="targetAudience" placeholder="说明主要面向哪些人，以及他们的需求" required maxlength="5000" rows="3"></textarea></label>
</div></section>
<section class="list-panel form-section"><div class="panel-heading"><div><h2>补充信息</h2><p>补充品牌、竞品和市场信息，让后续分析更准确。</p></div></div><div class="form-grid">
<label class="form-field"><span>别名／品牌名</span><textarea id="aliases" name="aliases" placeholder="每行一项，可填写简称和英文名" rows="3"></textarea></label>
<label class="form-field"><span>主要竞品</span><textarea id="competitors" name="competitors" placeholder="每行一个竞品名称" rows="3"></textarea></label>
<label class="form-field"><span>目标市场</span><input id="targetMarket" name="targetMarket" placeholder="例如：中国、北美" maxlength="200" type="text"></label>
<label class="form-field"><span>目标语言</span><input id="targetLanguage" name="targetLanguage" placeholder="例如：中文、英语" maxlength="100" type="text"></label>
</div></section>
<section class="list-panel form-section"><div class="panel-heading"><div><h2>高级配置</h2><p>按需填写卖点、价格与目标关键词。</p></div></div><div class="form-grid">
<label class="form-field"><span>核心卖点</span><textarea id="sellingPoints" name="sellingPoints" placeholder="说明产品的差异和优势" maxlength="5000" rows="3"></textarea></label>
<label class="form-field"><span>价格说明</span><textarea id="pricing" name="pricing" placeholder="例如：免费版、每月 99 元、按用量计费" maxlength="2000" rows="3"></textarea></label>
<label class="form-field"><span>目标关键词</span><textarea id="keywords" name="keywords" placeholder="每行一个希望监测的问题或关键词" rows="3"></textarea></label>
</div></section>
                <p id="project-error" class="form-error" role="alert" hidden></p>
                <div class="form-actions"><a class="text-button" href="./projects.html?v=20261011-config3">查看项目列表</a><button id="create-project" class="primary-button" type="submit">创建项目</button></div>
            </form>
        </main>
    </div>
</div>
<script src="./shared/http.js?v=20261021-login1"></script>
<script src="./projects.js?v=20261027-delete1"></script>
</body>
</html>
