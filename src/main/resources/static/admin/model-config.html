<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10233f">
    <title>模型配置 · GEO 管理平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-login1">
    <link rel="stylesheet" href="./styles/components.css?v=20261017-layout4">
    <link rel="stylesheet" href="./styles/forms.css?v=20261017-layout4">
<link rel="stylesheet" href="./models.css?v=20261017-layout4">
    <script src="./shared/navigation.js?v=20261026-import-export1" defer></script>
</head>
<body class="standard-page">
<div class="app-shell">
    <aside class="sidebar" aria-label="主导航" data-admin-navigation></aside>
    <div class="main-area">
        <header class="topbar"><div class="breadcrumb" aria-label="当前位置"></div><div class="topbar-label">管理平台</div></header>
        <main class="content">
<div class="page-heading"><div><p class="eyebrow">BASIC CONFIGURATION</p><h1 id="model-heading">模型配置</h1><p class="page-description">维护共享模型渠道，供诊断、问题生成和内容优化使用。</p></div></div>
<form id="model-form">
<section class="list-panel form-section"><div class="panel-heading"><div><h2>连接与模型</h2><p>每个渠道对应一个模型。配置直接保存到数据库，已有密钥不回显。</p></div></div>
<div class="form-grid">
<label class="form-field"><span>渠道编码</span><input name="channelCode" id="channelCode" type="text" required maxlength="100" pattern="[a-zA-Z0-9_-]+" placeholder="例如：deepseek-chat"></label>
<label class="form-field"><span>渠道名称</span><input name="channelName" id="channelName" type="text" required maxlength="200" placeholder="例如：DeepSeek 日常问答"></label>
<label class="form-field"><span>供应商标识</span><input name="providerCode" id="providerCode" type="text" required maxlength="100" placeholder="例如：deepseek"></label>
<label class="form-field"><span>调用策略</span><select name="strategyBeanName" id="strategyBeanName" required><option value="">正在加载策略…</option></select><small id="api-key-console" hidden>获取 API Key：<a id="api-key-console-link" target="_blank" rel="noopener noreferrer"></a></small></label>
<label class="form-field"><span>接口地址</span><input name="baseUrl" id="baseUrl" type="url" maxlength="2048" placeholder="https://api.example.com/v1"></label>
<label class="form-field"><span>选用模型</span><input name="modelName" id="modelName" type="text" maxlength="200" placeholder="填写平台提供的模型 ID 或接入点 ID"><small>填写平台调用示例中的 model 值，不是“豆包”等展示名称。</small></label>
<label class="form-field"><span>API 密钥</span><input name="apiKey" id="apiKey" type="password" maxlength="8192" autocomplete="new-password" placeholder="填写密钥；编辑时留空保留原值"><small id="key-status">远程渠道启用前需保存密钥。</small></label>
</div></section>
<section class="list-panel form-section"><div class="panel-heading"><div><h2>调用规则</h2><p>默认优先级越大越优先；相同时按渠道 ID 升序选择。停用渠道不参与调用。</p></div></div><div class="form-grid">
<label class="form-field"><span>默认优先级</span><input name="score" id="score" type="number" required min="-2147483648" max="2147483647" value="0" placeholder="数值越大越优先"></label>
<label class="form-field"><span>生成随机性（可选）</span><input name="temperature" id="temperature" type="number" min="0" max="2" step="0.01" placeholder="留空不发送；填写 0 到 2"></label>
<label class="form-field"><span>输出 token 上限</span><input name="maxTokens" id="maxTokens" type="number" required min="1" max="1000000" value="60000" placeholder="60000"><small>包含推理 token；超过模型上限时厂商会拒绝（如 ernie-4.5 为 12288），需按模型调低。</small></label>
<label class="model-check"><input type="checkbox" name="enabled" id="enabled">启用渠道</label>
<p class="model-help" id="generation-help"></p>
<p class="model-help">请求超时和 HTTPS 证书校验由服务的统一 HTTP 配置维护，不在渠道中单独设置。</p>
<p class="model-help" id="protocol-help">请求参数由实际策略决定，接口协议不代表模型一定支持搜索。</p>
</div></section>
<p id="model-error" class="notice notice-error" role="alert" hidden></p>
<div class="form-actions"><a class="text-button" href="./models.html?v=20261011-config3">返回模型列表</a><button id="save-model" class="primary-button" type="submit">保存模型配置</button></div>
</form></main></div></div><script src="./shared/http.js?v=20261029-failure1"></script><script src="./models.js?v=20261029-delete1"></script></body></html>
